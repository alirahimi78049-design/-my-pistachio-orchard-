name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Assemble Pistachio App
        run: |
          flutter create --org com.pistachio.orchard pistachio_app
          cd pistachio_app
          
          flutter pub add flutter_localizations --sdk=flutter
          flutter pub add intl
          flutter pub add shamsi_date
          flutter pub add google_fonts
          
          # پیدا کردن فایل کدهای دارت چه در پوشه Lib باشد چه lib
          find .. -name "main.dart" -not -path "*/pistachio_app/*" -exec cp {} lib/main.dart \;
          
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../PistachioOrchardApp.apk

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ github.run_number }}
          name: "نسخه نهایی اپلیکیشن باغ پسته (بیلد شماره ${{ github.run_number }})"
          body: "فایل نصبی مستقیم اندروید (APK)"
          files: PistachioOrchardApp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
