name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build Clean Flutter App
        run: |
          if [ -d "Lib" ]; then
            mv Lib lib
          fi
          flutter create --org com.pistachio pistachio_app
          cd pistachio_app
          flutter pub add flutter_localizations --sdk=flutter
          flutter pub add intl
          flutter pub add shamsi_date
          flutter pub add google_fonts
          cp ../lib/*.dart lib/
          flutter build apk --debug
          mv build/app/outputs/flutter-apk/app-debug.apk ../PistachioApp.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: Pistachio Orchard App v1.0
          files: PistachioApp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
