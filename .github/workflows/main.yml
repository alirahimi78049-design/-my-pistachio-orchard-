name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build Clean Flutter App
        run: |
          flutter create --org com.pistachio pistachio_app
          cp pubspec.yaml pistachio_app/
          cp lib/main.dart pistachio_app/lib/
          cd pistachio_app
          flutter pub get
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pistachio-Orchard-App
          path: pistachio_app/build/app/outputs/flutter-apk/app-debug.apk
