name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build Clean Flutter App
        run: |
          # تبدیل خودکار Lib به lib در صورت وجود
          if [ -d "Lib" ]; then
            mv Lib lib
          fi
          flutter create --org com.pistachio pistachio_app
          cd pistachio_app
          flutter pub add flutter_localizations --sdk=flutter
          flutter pub add intl
          flutter pub add shamsi_date
          flutter pub add google_fonts
          cp ../lib/*.dart lib/
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pistachio-Orchard-App
          path: pistachio_app/build/app/outputs/flutter-apk/app-debug.apk
